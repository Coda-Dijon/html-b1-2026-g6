<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeau Black Friday – Street Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Montserrat', sans-serif; }

    /* ===== BANDEAU BLACK FRIDAY ===== */
    .bandeau {
      background: #000;
      color: #fff;
      overflow: hidden;            /* cache ce qui dépasse */
      white-space: nowrap;
      position: relative;
      padding: 3px 0;              /* épaisseur des bordures métallisées */
    }

    /* bordures haut et bas en rouge métallisé */
    .bandeau::before, .bandeau::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #5a0000, #c4000a, #ff6b6b, #ffd0d0, #ff3b3b, #8b0000, #c4000a, #ff6b6b, #5a0000);
      background-size: 200% 100%;
      animation: brillance 3s linear infinite;
    }
    .bandeau::before { top: 0; }
    .bandeau::after  { bottom: 0; }

    .bandeau-piste {
      display: inline-flex;
      align-items: center;
      animation: defiler 25s linear infinite;
    }

    /* pause quand on passe la souris dessus */
    .bandeau:hover .bandeau-piste { animation-play-state: paused; }

    .bandeau-element {
      display: inline-flex;
      align-items: center;
      gap: 28px;
      padding: 10px 28px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
    }

    .bandeau-element img { height: 54px; }

    /* rouge métallisé : dégradé + reflet qui passe */
    .rouge {
      background: linear-gradient(110deg, #6b0000 0%, #c4000a 25%, #ff7a7a 45%, #fff0f0 50%, #ff7a7a 55%, #c4000a 75%, #6b0000 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brillance 3s linear infinite;
      filter: drop-shadow(0 0 2px rgba(255, 40, 40, .45));
    }

    @keyframes brillance {
      from { background-position: 100% 0; }
      to   { background-position: -150% 0; }
    }

    /* le contenu est écrit 2 fois : on le décale de la moitié pour une boucle sans coupure */
    @keyframes defiler {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <!-- ===== BANDEAU BLACK FRIDAY ===== -->
  <div class="bandeau">
    <div class="bandeau-piste">
      <!-- 1re copie -->
      <div class="bandeau-element">
        <img src="images/logo-blanc.png" alt="Street Style">
        <span>BLACK FRIDAY</span><span class="rouge">★</span>
        <span>JUSQU'À <span class="rouge">-50 %</span></span><span class="rouge">★</span>
        <span>DU 27 AU 30 NOVEMBRE</span><span class="rouge">★</span>
        <img src="images/logo-blanc.png" alt="Street Style">
        <span>BLACK FRIDAY</span><span class="rouge">★</span>
        <span>JUSQU'À <span class="rouge">-50 %</span></span><span class="rouge">★</span>
        <span>DU 27 AU 30 NOVEMBRE</span><span class="rouge">★</span>
      </div>
      <!-- 2e copie identique (obligatoire pour la boucle) -->
      <div class="bandeau-element">
        <img src="images/logo-blanc.png" alt="Street Style">
        <span>BLACK FRIDAY</span><span class="rouge">★</span>
        <span>JUSQU'À <span class="rouge">-50 %</span></span><span class="rouge">★</span>
        <span>DU 27 AU 30 NOVEMBRE</span><span class="rouge">★</span>
        <img src="images/logo-blanc.png" alt="Street Style">
        <span>BLACK FRIDAY</span><span class="rouge">★</span>
        <span>JUSQU'À <span class="rouge">-50 %</span></span><span class="rouge">★</span>
        <span>DU 27 AU 30 NOVEMBRE</span><span class="rouge">★</span>
      </div>
    </div>
  </div>

</body>
</html>
