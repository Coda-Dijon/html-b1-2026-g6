<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bannière Black Friday</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }

    .banniere {
      background: black;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      text-align: center;
      padding: calc(15px + 0.5cm) 15px;
      border-top: 3px solid #b0000a;
      border-bottom: 3px solid #b0000a;
    }


    .rouge {
      background: linear-gradient(#ff8080, #c4000a, #6b0000);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Version mobile : banderole plus petite */
    @media (max-width: 768px) {
      .banniere { font-size: 28px; padding: 15px 10px; }
    }
  </style>
</head>
<body>

  <div class="banniere">
    BLACK FRIDAY <span class="rouge">-50 %</span>
  </div>

</body>
</html>
